<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Kumar | Frontend Developer</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6', // Primary Accent
                            600: '#2563eb', // Hover Accent
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            // --- STATE MANAGEMENT ---
            const [isDark, setIsDark] = useState(false);
            const [repos, setRepos] = useState([]);
            const [apiStatus, setApiStatus] = useState('loading'); // loading, success, error
            const username = "localhostamit";

            // --- EFFECTS ---
            // 1. Dark Mode Persistence
            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, []);

            const toggleTheme = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    setIsDark(true);
                }
            };

            // 2. GitHub API Fetch with Error Handling
            useEffect(() => {
                const fetchRepos = async () => {
                    try {
                        const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                        if (!res.ok) throw new Error("GitHub API rate limit or network issue.");
                        const data = await res.json();
                        setRepos(data);
                        setApiStatus('success');
                    } catch (error) {
                        console.error(error);
                        setApiStatus('error');
                    }
                };
                fetchRepos();
            }, []);

            // --- DATA STRUCTURES ---
            const skills = {
                Frontend: ["HTML5", "CSS3", "JavaScript (ES6+)", "React.js", "Tailwind CSS"],
                Backend: ["Firebase (Auth/DB)", "REST APIs", "C/C++/Java (Basics)"],
                Tools: ["Git & GitHub", "Linux (Ubuntu/Kali)", "SEO Optimization", "Blogger CMS"]
            };

            const projects = [
                {
                    title: "PyqHubs.in",
                    desc: "Educational platform serving 10,000+ KUK students with academic resources. Built with custom theme development and Google Drive API integration.",
                    img: "https://placehold.co/600x300/eff6ff/1e3a8a?text=PyqHubs",
                    tech: ["Blogger CMS", "SEO", "Drive API"],
                    live: "https://www.pyqhubs.in",
                    github: "https://github.com/localhostamit" 
                },
                {
                    title: "AmitFlix",
                    desc: "Dynamic movie database fetching real-time data via Open Movie APIs. Features a Firebase-powered admin panel for content management.",
                    img: "https://placehold.co/600x300/eff6ff/1e3a8a?text=AmitFlix",
                    tech: ["JavaScript", "Firebase", "REST API"],
                    live: "https://amitflix.localhostamit.me",
                    github: "https://github.com/localhostamit"
                },
                {
                    title: "GhostLink",
                    desc: "A secure, browser-based peer-to-peer web chat application enabling direct communication without traditional backend server infrastructure.",
                    img: "https://placehold.co/600x300/eff6ff/1e3a8a?text=GhostLink",
                    tech: ["WebRTC", "JavaScript", "P2P"],
                    live: "https://ghostlink.localhostamit.me",
                    github: "https://github.com/localhostamit"
                },
                {
                    title: "KisanMitra",
                    desc: "Utility dashboard displaying real-time agricultural market rates by integrating Government Open Data APIs to assist local farmers.",
                    img: "https://placehold.co/600x300/eff6ff/1e3a8a?text=KisanMitra",
                    tech: ["Gov API", "JavaScript", "HTML/CSS"],
                    live: "https://kisanmitra.localhostamit.me",
                    github: "https://github.com/localhostamit"
                }
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    
                    {/* --- NAVIGATION --- */}
                    <nav className="fixed w-full z-50 top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <a href="#" className="font-bold text-xl tracking-tight text-gray-900 dark:text-white">
                                Amit<span className="text-brand-500">.dev</span>
                            </a>
                            <div className="flex items-center gap-6">
                                <div className="hidden md:flex gap-6 text-sm font-medium text-gray-600 dark:text-gray-300">
                                    <a href="#about" className="hover:text-brand-500 transition-colors">About</a>
                                    <a href="#projects" className="hover:text-brand-500 transition-colors">Projects</a>
                                    <a href="#skills" className="hover:text-brand-500 transition-colors">Skills</a>
                                    <a href="#github" className="hover:text-brand-500 transition-colors">GitHub</a>
                                </div>
                                <button 
                                    onClick={toggleTheme}
                                    className="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                                    aria-label="Toggle Dark Mode"
                                >
                                    <i className={`fas ${isDark ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* --- HERO SECTION --- */}
                    <header id="about" className="pt-32 pb-20 md:pt-48 md:pb-32 px-6 max-w-6xl mx-auto flex flex-col justify-center min-h-[80vh]">
                        <p className="text-brand-500 font-medium mb-4 tracking-wide text-sm uppercase">BCA Student & Web Developer</p>
                        <h1 className="text-5xl md:text-7xl font-bold mb-6 tracking-tight text-gray-900 dark:text-white">
                            Amit Kumar.
                        </h1>
                        <h2 className="text-3xl md:text-5xl font-semibold mb-6 text-gray-500 dark:text-gray-400 tracking-tight">
                            I build scalable digital experiences.
                        </h2>
                        <p className="text-lg text-gray-600 dark:text-gray-400 max-w-2xl mb-10 leading-relaxed">
                            Self-driven frontend developer experienced in building and managing platforms serving over 10,000+ users. I specialize in React, JavaScript, API integrations, and creating clean, user-centric interfaces.
                        </p>
                        <div className="flex flex-wrap items-center gap-4">
                            <a href="#projects" className="px-6 py-3 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all shadow-sm hover:shadow-md hover:-translate-y-0.5">
                                View My Work
                            </a>
                            <a href="https://github.com/localhostamit" target="_blank" className="px-6 py-3 rounded-lg border border-gray-300 dark:border-gray-700 hover:border-gray-400 dark:hover:border-gray-500 text-gray-700 dark:text-gray-300 font-medium transition-all hover:bg-gray-50 dark:hover:bg-gray-800">
                                <i className="fab fa-github mr-2"></i> GitHub Profile
                            </a>
                        </div>
                    </header>

                    {/* --- PROJECTS SECTION --- */}
                    <section id="projects" className="py-20 px-6 bg-white dark:bg-gray-900 border-y border-gray-100 dark:border-gray-800 transition-colors">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-12">
                                <h2 className="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                    <span className="text-brand-500">01.</span> Featured Projects
                                </h2>
                                <p className="text-gray-500 dark:text-gray-400 mt-2">Real-world applications I've built and deployed.</p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-8">
                                {projects.map((project, index) => (
                                    <div key={index} className="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all group">
                                        {/* Project Image */}
                                        <div className="h-48 overflow-hidden bg-gray-200 dark:bg-gray-800 relative">
                                            <img src={project.img} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                        </div>
                                        
                                        {/* Project Content */}
                                        <div className="p-6 flex flex-col h-[calc(100%-12rem)]">
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="text-xl font-bold text-gray-900 dark:text-white">{project.title}</h3>
                                                <div className="flex gap-4 text-gray-500 dark:text-gray-400">
                                                    <a href={project.github} target="_blank" className="hover:text-brand-500 transition-colors" title="Source Code"><i className="fab fa-github text-xl"></i></a>
                                                    <a href={project.live} target="_blank" className="hover:text-brand-500 transition-colors" title="Live Preview"><i className="fas fa-external-link-alt text-xl"></i></a>
                                                </div>
                                            </div>
                                            <p className="text-gray-600 dark:text-gray-400 text-sm mb-6 flex-grow leading-relaxed">
                                                {project.desc}
                                            </p>
                                            <div className="flex flex-wrap gap-2 text-xs font-medium text-brand-600 dark:text-brand-400">
                                                {project.tech.map((t, i) => (
                                                    <span key={i} className="bg-brand-50 dark:bg-brand-900/30 px-2.5 py-1 rounded-md border border-brand-100 dark:border-brand-800/50">{t}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* --- SKILLS SECTION --- */}
                    <section id="skills" className="py-20 px-6 max-w-6xl mx-auto w-full">
                        <div className="mb-12">
                            <h2 className="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                <span className="text-brand-500">02.</span> Technical Skills
                            </h2>
                        </div>

                        <div className="grid md:grid-cols-3 gap-8">
                            {Object.entries(skills).map(([category, items]) => (
                                <div key={category} className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-xl shadow-sm">
                                    <h3 className="text-lg font-semibold text-gray-900 dark:text-white mb-4 border-b border-gray-100 dark:border-gray-800 pb-2">
                                        {category}
                                    </h3>
                                    <ul className="space-y-3">
                                        {items.map((skill, index) => (
                                            <li key={index} className="flex items-center text-gray-600 dark:text-gray-400 text-sm">
                                                <i className="fas fa-check text-brand-500 mr-3 text-xs"></i>
                                                {skill}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* --- EDUCATION & CERTIFICATIONS --- */}
                    <section className="py-20 px-6 bg-white dark:bg-gray-900 border-y border-gray-100 dark:border-gray-800 transition-colors">
                        <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-12">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-2">
                                    <i className="fas fa-graduation-cap text-brand-500"></i> Education
                                </h2>
                                <div className="border-l-2 border-gray-200 dark:border-gray-800 pl-6 ml-3 relative">
                                    <div className="absolute w-3 h-3 bg-brand-500 rounded-full -left-[7px] top-1.5 ring-4 ring-white dark:ring-gray-900"></div>
                                    <h3 className="text-lg font-bold text-gray-900 dark:text-white">Bachelor of Computer Applications (BCA)</h3>
                                    <p className="text-brand-600 dark:text-brand-400 font-medium text-sm mt-1">Kurukshetra University (KUK)</p>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm mt-2">Expected Graduation: 2027 • 4th Semester Student</p>
                                </div>
                            </div>

                            <div>
                                <h2 className="text-2xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-2">
                                    <i className="fas fa-award text-brand-500"></i> Certifications
                                </h2>
                                <div className="space-y-6">
                                    <div className="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 p-4 rounded-lg">
                                        <h3 className="font-bold text-gray-900 dark:text-white">Yuva AI for All</h3>
                                        <p className="text-gray-500 dark:text-gray-400 text-sm mt-1">Fundamentals and applications of Artificial Intelligence.</p>
                                    </div>
                                    <div className="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 p-4 rounded-lg">
                                        <h3 className="font-bold text-gray-900 dark:text-white">FCCB (Hartron)</h3>
                                        <p className="text-gray-500 dark:text-gray-400 text-sm mt-1">Computer operations and applications.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- GITHUB API SECTION --- */}
                    <section id="github" className="py-20 px-6 max-w-6xl mx-auto w-full">
                        <div className="flex justify-between items-end mb-10 border-b border-gray-200 dark:border-gray-800 pb-4">
                            <div>
                                <h2 className="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                    <span className="text-brand-500">03.</span> Latest Repositories
                                </h2>
                                <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">Dynamically fetched from GitHub API</p>
                            </div>
                            <a href={`https://github.com/${username}`} target="_blank" className="hidden sm:flex text-brand-600 dark:text-brand-400 hover:text-brand-500 font-medium text-sm items-center gap-1 transition-colors">
                                View all <i className="fas fa-arrow-right"></i>
                            </a>
                        </div>

                        {/* Status Handling */}
                        {apiStatus === 'loading' && (
                            <div className="flex flex-col items-center justify-center py-12 text-gray-500 dark:text-gray-400">
                                <i className="fas fa-circle-notch fa-spin text-3xl text-brand-500 mb-4"></i>
                                <p>Fetching repositories...</p>
                            </div>
                        )}

                        {apiStatus === 'error' && (
                            <div className="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-6 rounded-xl text-center">
                                <i className="fas fa-exclamation-circle text-2xl mb-2"></i>
                                <p className="font-medium">Unable to load repositories.</p>
                                <p className="text-sm mt-1">GitHub API rate limit may have been reached. Please check back later or visit my profile directly.</p>
                                <a href={`https://github.com/${username}`} target="_blank" className="inline-block mt-4 px-4 py-2 bg-red-100 dark:bg-red-900/50 rounded-lg text-sm font-medium hover:bg-red-200 dark:hover:bg-red-900 transition-colors">Go to GitHub Profile</a>
                            </div>
                        )}

                        {apiStatus === 'success' && (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {repos.map(repo => (
                                    <a key={repo.id} href={repo.html_url} target="_blank" className="block bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-xl hover:shadow-md transition-shadow group">
                                        <div className="flex justify-between items-start mb-3 text-gray-400 dark:text-gray-500">
                                            <i className="far fa-folder text-2xl group-hover:text-brand-500 transition-colors"></i>
                                            <div className="flex items-center gap-3 text-sm">
                                                <span><i className="fas fa-star text-yellow-400"></i> {repo.stargazers_count}</span>
                                            </div>
                                        </div>
                                        <h3 className="font-bold text-lg text-gray-900 dark:text-white mb-2 truncate group-hover:text-brand-500 transition-colors">{repo.name}</h3>
                                        <p className="text-sm text-gray-500 dark:text-gray-400 h-10 overflow-hidden mb-4">{repo.description || "No description provided."}</p>
                                        <div className="flex items-center text-xs font-medium text-gray-500 dark:text-gray-500">
                                            <span className="flex items-center gap-1.5">
                                                <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                                                {repo.language || "HTML"}
                                            </span>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        )}
                    </section>

                    {/* --- CONTACT / FOOTER --- */}
                    <footer className="mt-auto py-12 px-6 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 text-center transition-colors">
                        <div className="max-w-3xl mx-auto">
                            <h2 className="text-2xl font-bold text-gray-900 dark:text-white mb-6">Let's Connect</h2>
                            <p className="text-gray-600 dark:text-gray-400 mb-8 text-sm max-w-xl mx-auto">
                                Currently based in Karnal, Haryana. I'm open to discussing web development roles, API integrations, and building scalable platforms.
                            </p>
                            
                            <div className="flex justify-center gap-6 mb-10">
                                <a href="mailto:kumaramit02934@gmail.com" className="w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:text-white transition-all shadow-sm">
                                    <i className="fas fa-envelope text-lg"></i>
                                </a>
                                <a href="tel:+917988650874" className="w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:text-white transition-all shadow-sm">
                                    <i className="fas fa-phone-alt text-lg"></i>
                                </a>
                                <a href="https://linkedin.com/in/amitkumar7988" target="_blank" className="w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:text-white transition-all shadow-sm">
                                    <i className="fab fa-linkedin-in text-lg"></i>
                                </a>
                                <a href="https://github.com/localhostamit" target="_blank" className="w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:text-white transition-all shadow-sm">
                                    <i className="fab fa-github text-lg"></i>
                                </a>
                            </div>
                            
                            <p className="text-sm text-gray-400 dark:text-gray-500 font-medium">
                                © {new Date().getFullYear()} Amit Kumar. Built with React & Tailwind.
                            </p>
                        </div>
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
