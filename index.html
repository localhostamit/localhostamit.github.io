<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit | The Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Custom cursor handling */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Custom Cursor --- */
        .cursor {
            width: 20px;
            height: 20px;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }
        .cursor-dot {
            width: 4px;
            height: 4px;
            background: var(--neon-blue);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- Cinematic Grain Overlay --- */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 900;
        }

        /* --- Moving Spotlight Background --- */
        .spotlight {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(50px);
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            position: fixed;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 50px;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 50px;
            max-width: 1400px;
            width: 100%;
        }

        .hero-text h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 6rem;
            line-height: 0.9;
            text-transform: uppercase;
            position: relative;
            animation: glitch 3s infinite;
        }

        .hero-text h1 span {
            color: transparent;
            -webkit-text-stroke: 2px var(--text-main);
            display: block;
        }

        .hero-text h1 span.filled {
            color: var(--text-main);
            -webkit-text-stroke: 0;
        }

        .hero-subtitle {
            margin-top: 20px;
            font-size: 1.2rem;
            color: var(--neon-blue);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hero-img-container {
            position: relative;
            width: 400px;
            height: 500px;
            justify-self: end;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            transition: 0.5s;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }

        .hero-img:hover {
            filter: grayscale(0%) contrast(1);
        }

        .img-decoration {
            position: absolute;
            top: 20px;
            left: -20px;
            width: 100%;
            height: 100%;
            border: 2px solid var(--neon-purple);
            z-index: -1;
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }

        /* --- Glitch Animation --- */
        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--neon-purple), -2px -2px var(--neon-blue); }
            20% { text-shadow: -2px -2px var(--neon-purple), 2px 2px var(--neon-blue); }
            40% { text-shadow: 0 0 transparent; }
            100% { text-shadow: 0 0 transparent; }
        }

        /* --- Projects Grid --- */
        .projects-section {
            padding: 100px 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            font-family: 'Syncopate', sans-serif;
            font-size: 2rem;
            margin-bottom: 50px;
            border-left: 5px solid var(--neon-blue);
            padding-left: 20px;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        /* --- Holographic Card Style --- */
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            position: relative;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: 0.1s;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .card-content {
            transform: translateZ(30px); /* 3D Pop effect */
            position: relative;
            z-index: 2;
        }

        .card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            height: 60px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .lang-tag {
            font-size: 0.8rem;
            color: var(--neon-purple);
            font-weight: bold;
            background: rgba(188, 19, 254, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .btn-view {
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-view:hover {
            color: var(--neon-blue);
            gap: 15px;
        }

        /* --- Footer --- */
        footer {
            padding: 50px;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: 100px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* --- Mobile --- */
        @media (max-width: 900px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text h1 { font-size: 3.5rem; }
            .hero-img-container { display: none; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div class="cursor"></div>
    <div class="cursor-dot"></div>
    <div class="grain"></div>
    <div class="spotlight" id="spotlight"></div>

    <nav>
        <div class="logo">Localhost<span style="color:var(--neon-blue)">Amit</span></div>
        <div class="nav-links">
            <a href="#">Origin</a>
            <a href="#">Archive</a>
            <a href="https://github.com/localhostamit" target="_blank">GitHub</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>
                    <span>The</span>
                    <span class="filled">Amit</span>
                    <span>Protocols</span>
                </h1>
                <div class="hero-subtitle">// Developer // Visionary</div>
            </div>
            <div class="hero-img-container">
                <div class="img-decoration"></div>
                <img src="profile.jpg" alt="Amit" class="hero-img" onerror="this.src='https://via.placeholder.com/400x500/111/fff?text=No+Image'">
            </div>
        </div>
    </section>

    <section class="projects-section">
        <h2 class="section-header">Project Archive_</h2>
        <div class="grid" id="repo-grid">
            <div style="color:white">Initializing connection to GitHub API...</div>
        </div>
    </section>

    <footer>
        <p>SYSTEM STATUS: ONLINE // © 2025 AMIT</p>
    </footer>

    <script>
        // --- 1. Custom Cursor Logic ---
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');
        const spotlight = document.getElementById('spotlight');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';

            // Move spotlight
            spotlight.style.left = e.clientX + 'px';
            spotlight.style.top = e.clientY + 'px';
        });

        // --- 2. GitHub API Fetch ---
        const username = 'localhostamit';
        const grid = document.getElementById('repo-grid');

        async function fetchRepos() {
            try {
                const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                const repos = await res.json();
                
                grid.innerHTML = ''; // Clear loading text

                repos.forEach(repo => {
                    const desc = repo.description || "Classified project information.";
                    const lang = repo.language || "N/A";

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-content">
                            <h3>${repo.name}</h3>
                            <p>${desc}</p>
                            <div class="card-meta">
                                <span class="lang-tag">${lang}</span>
                                <a href="${repo.html_url}" target="_blank" class="btn-view">
                                    INITIATE <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    
                    // Add 3D Tilt Event Listeners
                    card.addEventListener('mousemove', handleTilt);
                    card.addEventListener('mouseleave', resetTilt);
                    
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p style="color:red">Error: GitHub Uplink Failed.</p>';
            }
        }

        // --- 3. 3D Tilt Effect Logic ---
        function handleTilt(e) {
            const card = this;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -10; // Rotation max 10deg
            const rotateY = ((x - centerX) / centerX) * 10;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function resetTilt() {
            this.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
        }

        fetchRepos();
    </script>
</body>
</html>
