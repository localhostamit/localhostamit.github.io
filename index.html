                                    </div>
                                    <input type="text" name="_subject" className={inputClass} placeholder="Subject" required />
                                    <textarea name="message" rows="5" className={`${inputClass} resize-none`} placeholder="Message" required></textarea>
                                    <button type="submit" className="w-full rounded-2xl bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-500 px-6 py-4 text-sm font-semibold text-white shadow-lg transition-transform hover:-translate-y-1">Send Message</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- FOOTER COMPONENT ---
        const Footer = ({ darkMode }) => (
            <footer className={`border-t py-6 transition-colors duration-500 ${darkMode ? "border-white/10 bg-[#060912] text-slate-400" : "border-slate-200 bg-white text-slate-500"}`}>
                <div className="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-5 text-center text-sm md:flex-row md:text-left">
                    <p>© {new Date().getFullYear()} Amit Kumar. All Rights Reserved.</p>
                    <p>Designed with React & Tailwind CSS</p>
                </div>
            </footer>
        );

        // --- APP ROOT ---
        const App = () => {
            const [darkMode, setDarkMode] = useState(true);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add("dark");
                else document.documentElement.classList.remove("dark");
            }, [darkMode]);

            return (
                <div className="min-h-screen">
                    <Navbar darkMode={darkMode} setDarkMode={setDarkMode} />
                    <Home darkMode={darkMode} />
                    <Overview darkMode={darkMode} />
                    <Projects darkMode={darkMode} />
                    <Certificates darkMode={darkMode} />
                    <Contact darkMode={darkMode} />
                    <Footer darkMode={darkMode} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
