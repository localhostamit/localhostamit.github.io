            // 1. Dark Mode Persistence
            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, []);

            const toggleTheme = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    setIsDark(true);
                }
            };

            // 2. GitHub API Fetch with Error Handling
            useEffect(() => {
                const fetchRepos = async () => {
                    try {
                        const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                        if (!res.ok) throw new Error("GitHub API rate limit or network issue.");
                        const data = await res.json();
                        setRepos(data);
                        setApiStatus('success');
                    } catch (error) {
                        console.error(error);
                        setApiStatus('error');
                    }
                };
                fetchRepos();
            }, []);

            useEffect(() => {
                if (selectedProject) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';

                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                            {/* Backdrop */}
                            <div 
                                className="absolute inset-0 bg-gray-900/60 backdrop-blur-sm modal-overlay"
                                onClick={() => setSelectedProject(null)}
                            ></div>
                            
                            {/* Modal Box */}
                            <div className="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 modal-content flex flex-col">
                                
                                {/* Header */}
                                <div className="sticky top-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur z-10 border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-3">
                                        <i className="fas fa-laptop-code text-brand-500"></i> 
                                        {selectedProject.title} <span className="text-gray-400 dark:text-gray-500 font-normal text-lg">Deep Dive</span>
                                    </h2>
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-red-100 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 transition-colors"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>

                                {/* Body */}
                                <div className="p-6 space-y-8">
                                    {/* Tech Stack Banner */}
                                    <div className="flex flex-wrap gap-2">
                                        {selectedProject.tech.map((t, i) => (
                                            <span key={i} className="bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-3 py-1.5 rounded-lg border border-brand-200 dark:border-brand-800/50 text-sm font-semibold">{t}</span>
                                        ))}
                                    </div>

                                    {/* Architecture */}
                                    <div>
                                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3 flex items-center gap-2">
                                            <i className="fas fa-sitemap"></i> System Architecture
                                        </h3>
                                        <p className="text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-950 p-4 rounded-lg border border-gray-100 dark:border-gray-800">
                                            {selectedProject.deepDive.architecture}
                                        </p>
                                    </div>

                                    {/* Challenge & Solution */}
                                    <div className="grid sm:grid-cols-2 gap-6">
                                        <div>
                                            <h3 className="text-sm font-bold uppercase tracking-wider text-red-400 dark:text-red-500/80 mb-3 flex items-center gap-2">
                                                <i className="fas fa-bolt"></i> The Challenge
                                            </h3>
                                            <p className="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
                                                {selectedProject.deepDive.challenge}
                                            </p>
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold uppercase tracking-wider text-green-500 dark:text-green-500/80 mb-3 flex items-center gap-2">
                                                <i className="fas fa-check-circle"></i> The Solution
                                            </h3>
                                            <p className="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">
                                                {selectedProject.deepDive.solution}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Footer Actions */}
                                <div className="mt-auto border-t border-gray-200 dark:border-gray-800 p-6 bg-gray-50 dark:bg-gray-950 rounded-b-2xl flex justify-end gap-4">
                                    <a 
                                        href={selectedProject.github} 
                                        target="_blank" 
                                        className="px-5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 hover:border-gray-400 dark:hover:border-gray-500 text-gray-700 dark:text-gray-300 font-medium transition-all hover:bg-white dark:hover:bg-gray-800 text-sm"
                                    >
                                        <i className="fab fa-github mr-2"></i> Source Code
                                    </a>
                                    <a 
                                        href={selectedProject.live} 
                                        target="_blank" 
                                        className="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all shadow-sm text-sm flex items-center gap-2"
                                    >
                                        Live Deployment <i className="fas fa-external-link-alt"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
