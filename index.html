        // --- REVEAL ANIMATION COMPONENT ---
        const Reveal = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const currentRef = domRef.current; // Copy ref to variable for safe cleanup
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        setIsVisible(true);
                        observer.unobserve(currentRef);
                    }
                }, { threshold: 0.1 });
                
                if (currentRef) observer.observe(currentRef);
                return () => { if (currentRef) observer.unobserve(currentRef); }
            }, []);

            return (
                <div 
                    ref={domRef} 
                    className={`transition-all duration-700 ease-out transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, []);

            const toggleTheme = () => {
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    setIsDark(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    setIsDark(true);

            // 2. GitHub API Fetch

                        const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=12`);

                    <section id="github" className="py-20 px-6 bg-white dark:bg-gray-900 border-y border-gray-100 dark:border-gray-800 w-full transition-colors">
                        <Reveal>
                            <div className="max-w-6xl mx-auto">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 border-b border-gray-200 dark:border-gray-800 pb-4 gap-4">
                                    <div>
                                        <h2 className="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                            <span className="text-brand-500">03.</span> Open Source
                                        </h2>
                                        <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">Dynamically fetched from GitHub API</p>
                                    </div>
                                    
                                    {/* Client-Side Live Search */}
                                    <div className="relative w-full sm:w-64">
                                        <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Filter repositories..." 
                                            value={repoSearchQuery}
                                            onChange={(e) => setRepoSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 text-gray-900 dark:text-white transition-colors"
                                        />
                                    </div>
                                </div>

                                {apiStatus === 'loading' && (
                                    <div className="flex flex-col items-center justify-center py-12 text-gray-500 dark:text-gray-400">
                                        <i className="fas fa-circle-notch fa-spin text-3xl text-brand-500 mb-4"></i>
                                        <p>Fetching repositories...</p>
                                    </div>
                                )}

                                {apiStatus === 'error' && (
                                    <div className="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-6 rounded-xl text-center">
                                        <i className="fas fa-exclamation-circle text-2xl mb-2"></i>
                                        <p className="font-medium">Unable to load repositories.</p>
                                        <p className="text-sm mt-1">GitHub API rate limit may have been reached.</p>
                                    </div>
                                )}

                                {apiStatus === 'success' && (
                                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredRepos.length > 0 ? filteredRepos.map((repo, i) => (
                                            <Reveal key={repo.id} delay={i * 50}>
                                                <a href={repo.html_url} target="_blank" className="block bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 p-6 rounded-xl hover:shadow-md transition-shadow group h-full flex flex-col">
                                                    <div className="flex justify-between items-start mb-3 text-gray-400 dark:text-gray-500">
                                                        <i className="far fa-folder text-2xl group-hover:text-brand-500 transition-colors"></i>
                                                        <div className="flex items-center gap-3 text-sm">
                                                            <span><i className="fas fa-star text-yellow-400"></i> {repo.stargazers_count}</span>
                                                        </div>
                                                    </div>
                                                    <h3 className="font-bold text-lg text-gray-900 dark:text-white mb-2 truncate group-hover:text-brand-500 transition-colors">{repo.name}</h3>
                                                    <p className="text-sm text-gray-500 dark:text-gray-400 flex-grow mb-4">{repo.description || "No description provided."}</p>
                                                    <div className="flex items-center text-xs font-medium text-gray-500 dark:text-gray-500 mt-auto">
                                                        <span className="flex items-center gap-1.5">
                                                            <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                                                            {repo.language || "HTML"}
                                                        </span>
                                                    </div>
                                                </a>
                                            </Reveal>
                                        )) : (
                                            <div className="col-span-full py-12 text-center text-gray-500">No repositories match your search.</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </Reveal>
                    </section>

                    {/* --- CONTACT / FOOTER --- */}
                    <footer className="mt-auto py-16 px-6 bg-gray-50 dark:bg-gray-950 border-t border-gray-200 dark:border-gray-800 transition-colors">
                        <Reveal>
                            <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                                {/* Contact Info */}
                                <div>
                                    <h2 className="text-3xl font-bold text-gray-900 dark:text-white mb-4">Let's Connect</h2>
                                    <p className="text-gray-600 dark:text-gray-400 mb-8 text-sm max-w-md leading-relaxed">
                                        Currently based in Karnal, Haryana. I'm actively open to Internship opportunities in Web Development roles. Reach out if you want to build something scalable.
                                    </p>
                                    
                                    <div className="flex gap-4 mb-8">
                                        <a href="mailto:kumaramit02934@gmail.com" className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all shadow-sm">
                                            <i className="fas fa-envelope text-lg"></i>
                                        </a>
                                        <a href="tel:+917988650874" className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all shadow-sm">
                                            <i className="fas fa-phone-alt text-lg"></i>
                                        </a>
                                        <a href="https://linkedin.com/in/amitkumar7988" target="_blank" className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all shadow-sm">
                                            <i className="fab fa-linkedin-in text-lg"></i>
                                        </a>
                                        <a href="https://github.com/localhostamit" target="_blank" className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-600 dark:text-gray-300 hover:bg-brand-500 hover:border-brand-500 hover:text-white transition-all shadow-sm">
                                            <i className="fab fa-github text-lg"></i>
                                        </a>
                                    </div>
                                    <p className="text-sm text-gray-400 dark:text-gray-500 font-medium">
                                        © {new Date().getFullYear()} Made with ❤️ By Amit Kumar.
                                    </p>
                                </div>

                                {/* FormSubmit Quick Form */}
                                <div className="bg-white dark:bg-gray-900 p-6 sm:p-8 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm">
                                    <form onSubmit={handleContactSubmit} className="space-y-4">
                                        <h3 className="font-bold text-gray-900 dark:text-white text-xl mb-4">Send a direct message</h3>
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Name</label>
                                                <input required type="text" value={contactFormState.name} onChange={e => setContactFormState({...contactFormState, name: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-lg text-sm focus:outline-none focus:border-brand-500 dark:text-white transition-colors" placeholder="John Doe" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Email</label>
                                                <input required type="email" value={contactFormState.email} onChange={e => setContactFormState({...contactFormState, email: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-lg text-sm focus:outline-none focus:border-brand-500 dark:text-white transition-colors" placeholder="john@email.com" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Message</label>
                                            <textarea required rows="4" value={contactFormState.message} onChange={e => setContactFormState({...contactFormState, message: e.target.value})} className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-lg text-sm focus:outline-none focus:border-brand-500 dark:text-white transition-colors resize-none" placeholder="Hey Amit, loved your portfolio..."></textarea>
                                        </div>
                                        
                                        <button 
                                            type="submit" 
                                            disabled={contactStatus === 'submitting'}
                                            className="w-full py-3 bg-brand-600 hover:bg-brand-500 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium rounded-lg transition-colors flex justify-center items-center gap-2 text-sm"
                                        >
                                            {contactStatus === 'submitting' ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-paper-plane"></i>}
                                            {contactStatus === 'submitting' ? 'Sending...' : 'Send Message'}
                                        </button>

                                        {contactStatus === 'success' && (
                                            <p className="text-green-500 text-sm text-center font-medium mt-2"><i className="fas fa-check-circle mr-1"></i> Message sent successfully!</p>
                                        )}
                                        {contactStatus === 'error' && (
                                            <p className="text-red-500 text-sm text-center font-medium mt-2"><i className="fas fa-exclamation-circle mr-1"></i> Failed to send. Please try email directly.</p>
                                        )}
                                    </form>
                                </div>
                            </div>
                        </Reveal>
                    </footer>

                    {/* --- CASE STUDY MODAL --- */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                            <div className="absolute inset-0 bg-gray-900/60 backdrop-blur-sm modal-overlay" onClick={() => setSelectedProject(null)}></div>
                            <div className="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 modal-content flex flex-col">
                                <div className="sticky top-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur z-10 border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-3">
                                        <i className="fas fa-laptop-code text-brand-500"></i> 
                                        {selectedProject.title} <span className="text-gray-400 dark:text-gray-500 font-normal text-lg">Deep Dive</span>
                                    </h2>
                                    <button onClick={() => setSelectedProject(null)} className="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 hover:bg-red-100 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>

                                <div className="p-6 space-y-8">
                                    <div className="flex flex-wrap gap-2">
                                        {selectedProject.tech.map((t, i) => (
                                            <span key={i} className="bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-3 py-1.5 rounded-lg border border-brand-200 dark:border-brand-800/50 text-sm font-semibold">{t}</span>
                                        ))}
                                    </div>

                                    <div>
                                        <h3 className="text-sm font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3 flex items-center gap-2"><i className="fas fa-sitemap"></i> System Architecture</h3>
                                        <p className="text-gray-700 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-950 p-4 rounded-lg border border-gray-100 dark:border-gray-800">{selectedProject.deepDive.architecture}</p>
                                    </div>

                                    <div className="grid sm:grid-cols-2 gap-6">
                                        <div>
                                            <h3 className="text-sm font-bold uppercase tracking-wider text-red-400 dark:text-red-500/80 mb-3 flex items-center gap-2"><i className="fas fa-bolt"></i> The Challenge</h3>
                                            <p className="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">{selectedProject.deepDive.challenge}</p>
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold uppercase tracking-wider text-green-500 dark:text-green-500/80 mb-3 flex items-center gap-2"><i className="fas fa-check-circle"></i> The Solution</h3>
                                            <p className="text-gray-700 dark:text-gray-300 text-sm leading-relaxed">{selectedProject.deepDive.solution}</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="mt-auto border-t border-gray-200 dark:border-gray-800 p-6 bg-gray-50 dark:bg-gray-950 rounded-b-2xl flex justify-end gap-4">
                                    <a href={selectedProject.github} target="_blank" className="px-5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 hover:border-gray-400 text-gray-700 dark:text-gray-300 font-medium transition-all hover:bg-white dark:hover:bg-gray-800 text-sm">
                                        <i className="fab fa-github mr-2"></i> Source Code
                                    </a>
                                    <a href={selectedProject.live} target="_blank" className="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition-all shadow-sm text-sm flex items-center gap-2">
                                        Live Deployment <i className="fas fa-external-link-alt"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
