<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit | Superhero Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-bg: #0b0c10;
            --secondary-bg: #1f2833;
            --hero-accent: #66fcf1; /* Neon Cyan */
            --hero-dark: #45a29e;
            --text-color: #c5c6c7;
            --white: #ffffff;
            --comic-red: #e23636; /* Avengers Red Accent */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Animations --- */
        @keyframes glow {
            0% { box-shadow: 0 0 5px var(--hero-accent); }
            50% { box-shadow: 0 0 20px var(--hero-accent), 0 0 10px var(--hero-accent); }
            100% { box-shadow: 0 0 5px var(--hero-accent); }
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- Header / Nav --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 12, 16, 0.95);
            position: fixed;
            width: 100%;
            z-index: 100;
            border-bottom: 2px solid var(--hero-dark);
        }

        .logo {
            font-size: 1.5rem;
            color: var(--hero-accent);
            font-weight: bold;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--comic-red);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 70%);
            padding: 20px;
        }

        .profile-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--hero-accent);
            animation: glow 3s infinite;
        }

        .hero-title {
            font-size: 5rem;
            color: var(--white);
            margin-bottom: 10px;
            animation: slideInLeft 1s ease-out;
            text-shadow: 3px 3px 0px var(--comic-red);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--hero-accent);
            margin-bottom: 30px;
        }

        .cta-btn {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--hero-accent);
            color: var(--hero-accent);
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Bebas Neue', cursive;
        }

        .cta-btn:hover {
            background: var(--hero-accent);
            color: var(--primary-bg);
            box-shadow: 0 0 20px var(--hero-accent);
        }

        /* --- GitHub Projects Section --- */
        .projects-section {
            padding: 80px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 50px;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 100px;
            height: 4px;
            background: var(--comic-red);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--secondary-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--hero-dark);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(102, 252, 241, 0.2);
            border-color: var(--hero-accent);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--comic-red);
        }

        .project-title {
            font-size: 1.8rem;
            color: var(--white);
            margin-bottom: 10px;
        }

        .project-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
            height: 60px; /* Fixed height for uniformity */
            overflow: hidden;
        }

        .project-stats {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--hero-dark);
            margin-bottom: 20px;
        }

        .repo-link {
            display: inline-block;
            color: var(--hero-accent);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed var(--hero-accent);
        }

        /* --- Loading State --- */
        #loading {
            text-align: center;
            color: var(--hero-accent);
            font-size: 1.5rem;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--secondary-bg);
            margin-top: 50px;
        }

        .social-icons a {
            color: var(--white);
            font-size: 1.5rem;
            margin: 0 15px;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: var(--hero-accent);
        }

        /* --- Mobile --- */
        @media (max-width: 768px) {
            .hero-title { font-size: 3.5rem; }
            .nav-links { display: none; } /* Simple hiding for this demo */
            .projects-section { padding: 50px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LOCALHOST<span style="color:var(--white)">AMIT</span></div>
        <div class="nav-links">
            <a href="#hero">HQ</a>
            <a href="#projects">MISSIONS</a>
            <a href="https://github.com/localhostamit" target="_blank">GITHUB</a>
        </div>
    </nav>

    <section class="hero" id="hero">
        <div class="profile-container">
            <img src="profile.jpg" alt="Amit" class="profile-img" onerror="this.src='https://via.placeholder.com/200/0b0c10/66fcf1?text=Amit'">
        </div>
        <h1 class="hero-title">AMIT</h1>
        <h3 class="hero-subtitle">Coding the Future // Breaking the Firewall</h3>
        <a href="#projects" class="cta-btn">View Mission Log</a>
    </section>

    <section class="projects-section" id="projects">
        <h2 class="section-title">Mission Log (GitHub)</h2>
        <div id="loading"><i class="fas fa-circle-notch fa-spin"></i> Accessing Mainframe...</div>
        <div class="projects-grid" id="projects-container">
            </div>
    </section>

    <footer>
        <div class="social-icons">
            <a href="https://github.com/localhostamit"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="margin-top: 15px; opacity: 0.6;">&copy; 2024 Amit. Styled by Jarvis.</p>
    </footer>

    <script>
        // GitHub Username
        const username = 'localhostamit';
        const container = document.getElementById('projects-container');
        const loading = document.getElementById('loading');

        // Fetch Repositories
        async function fetchProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const repos = await response.json();
                
                loading.style.display = 'none';

                repos.forEach(repo => {
                    // Create Card HTML
                    const card = document.createElement('div');
                    card.classList.add('project-card');

                    const description = repo.description ? repo.description : "Top secret mission details unavailable.";
                    const lang = repo.language ? repo.language : "Unknown";

                    card.innerHTML = `
                        <h3 class="project-title">${repo.name}</h3>
                        <p class="project-desc">${description}</p>
                        <div class="project-stats">
                            <span><i class="fas fa-circle" style="font-size: 8px; color: var(--hero-accent)"></i> ${lang}</span>
                            <span><i class="fas fa-star"></i> ${repo.stargazers_count}</span>
                            <span><i class="fas fa-code-branch"></i> ${repo.forks_count}</span>
                        </div>
                        <a href="${repo.html_url}" target="_blank" class="repo-link">ACCESS CODE <i class="fas fa-arrow-right"></i></a>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                loading.innerHTML = "System Error: Unable to fetch data from GitHub.";
                console.error('Error fetching repos:', error);
            }
        }

        // Initialize
        fetchProjects();

        // Simple smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
